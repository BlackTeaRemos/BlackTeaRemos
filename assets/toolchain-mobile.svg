<title id="title">The Wargame: Red Dragon mod toolchain</title>
<desc id="desc">Create mods with WGRD Mod Toolkit, distribute signed releases with WGRD Mod Manager, and load mods with WRG-Patcher. Conceptual workflow, not an automatic integration or protocol diagram.</desc>
